ng telegram bot which sends a message when the latest episode of your favourite anime is released. Inspired by his bot, I decided to make my own telegram bot. I had then r..."},{"slug":"basics","title":"Basics.","last_updated":"28 April 2026","preview":"--- There are certain things that you should do when playing Squash so that you are in a good position to remain in the rally, and, in most cases, win it by following these things. It’s the small things like having the proper racket preparation. Ensuring that you go back to the T..."},{"slug":"ready","title":"Ready","last_updated":"28 April 2026","preview":"--- During COVID the only active thing I would do was run. Every weekend I would schedule a long run. It usually used to be around 20 kilometres. I must have done quite many half-marathons over the year. As everything opened up, I joined a squash association. It was at a competit..."}],"sections":{"sections":[{"id":"latest","type":"notes","title":"Posts","items":null},{"id":"books","type":"books","title":"Books","items":[{"title":"Emissaries Around the Distant Sun","subtitle":"A Short Story Collection","cover":"/static/assets/imgs/books/emissaries-around-the-distant-sun.png","url":"https://a.co/d/9x9tTBE"}]}]},"current_note":{"title":"AI Environment Types","slug":"ai-environment-types","html":"<h1>AI Environment Types</h1>\n<hr />\n<img src=\"/static/assets/imgs/ai-env-types/rawpixel-558598-unsplash.jpg\" sizes=\"(max-width: 6628px) 100vw, 6628px\" />\n<p style=\"text-align:center\">\n  Photo by rawpixel on Unsplash\n</p>\n<p>An AI agent operates in an <em>environment</em>. For example, for a self-driving car, the environment is the road and for a chess-playing agent, the environment is the chessboard. Further, an environment might also have other agents operating on it. Like other autonomous vehicles in the example of the self-driving car. The nature of <em>environment</em> also varies based on the problem that the AI agent is intended to solve.</p>\n<p>The <a href=\"what-is-artificial-intelligence.html\">previous</a> blog post covered the definition of an artificial intelligence agent. In this post, I am going to explain in brief the classification of <em>environments</em>.</p>\n<h2>1. Fully Observable vs. Partially Observable</h2>\n<p>Consider the example of Chess where each player has access to the complete board information. Every decision is made considering the state of the board at that time and the possible moves by the other player. This is a 'fully observable' environment. Contrast this with Poker where players cannot anticipate the opponent's game as they do not have access to the opponent's cards. Such an environment is 'Partially Observable'.</p>\n<p>The environment of an autonomous vehicle is Partially Observable since the car cannot predict what the other cars might do.</p>\n<h2>2. Deterministic vs. Stochastic</h2>\n<p>In a Deterministic environment, the outcome is certain and can be determined based on a specific state. However, in a Stochastic environment, the next state cannot be predicted with certainty. Chess can be considered as having a Deterministic environment. The autonomous vehicle, however, has a Stochastic environment. Here, the decision taken by the autonomous vehicle is based on the probability of action of other vehicles.</p>\n<h2>3. Competitive vs. Collaborative</h2>\n<p>In Competitive environments, AI agents face other AI agents. Two AI agents playing chess against each other is an example of a Competitive environment. In Collaborative environments, AI agents work with each other to achieve a specific objective. Self-driving vehicles can be said to operate in a Collaborative environment as they coordinate their actions to avoid collisions.</p>\n<h2>4. Static vs. Dynamic</h2>\n<p>A Dynamic environment might change while the agent is processing a response. However, in a Static environment, the environment does not change during the course of decision making. An autonomous car has to deal with a Dynamic environment whereas, in Chess, the environment remains unchanged (Static) during the period a player is a contemplation the next move.</p>\n<h2>5. Episodic vs. Sequential</h2>\n<p>In a Sequential environment, the agent has to take decisions considering its previous decisions. However, in an Episodic environment, the agent has to consider only the current state of the environment.</p>\n<p><strong>You have reached the end 😎</strong></p>\n","extra_info":"Originally published on 12th September 2018","backlinks":[{"slug":"what-is-artificial-intelligence","title":"What is Artificial Intelligence","tags":["story","ai","programming"]}]},"graph":{"nodes":[{"slug":"a-cup-of-coffee-for-alan","title":"A Cup of Coffee for Alan","tags":["story","ai","programming"]},{"slug":"a-very-basic-introduction-to-artificial-neural-network","title":"A Very Basic Introduction to Artificial Neural Network","tags":["ai","programming"]},{"slug":"ai-that-writes-its-own-ai","title":"A.I That Writes Its Own A.I","tags":["story","ai","ml"]},{"slug":"aggressive","title":"Aggressive","tags":["ai"]},{"slug":"ai-environment-types","title":"AI Environment Types","tags":["story","ai"]},{"slug":"autoemailer","title":"AutoEmailer","tags":["ai","security","programming"]},{"slug":"basics","title":"Basics.","tags":["general"]},{"slug":"brain-machine-interfaces","title":"Brain Machine Interfaces","tags":["story","ai","programming"]},{"slug":"broken-links-and-readibility","title":"Broken Links and Readibility","tags":["story","ai","programming"]},{"slug":"creating-neural-network-from-scratch-in-python","title":"Creating Neural Network from Scratch in Python","tags":["ai","programming"]},{"slug":"decision-trees","title":"Decision Trees","tags":["ai","ml","programming"]},{"slug":"domains-of-warfare","title":"Domains of Warfare","tags":["security"]},{"slug":"elon-musk-vs-neil-degrasse-tyson-image-classifier-using-tensorflow","title":"Elon Musk vs Neil Degrasse Tyson Image Classifier Using Tensorflow","tag
