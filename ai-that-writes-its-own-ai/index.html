ng telegram bot which sends a message when the latest episode of your favourite anime is released. Inspired by his bot, I decided to make my own telegram bot. I had then r..."},{"slug":"basics","title":"Basics.","last_updated":"28 April 2026","preview":"--- There are certain things that you should do when playing Squash so that you are in a good position to remain in the rally, and, in most cases, win it by following these things. It’s the small things like having the proper racket preparation. Ensuring that you go back to the T..."},{"slug":"ready","title":"Ready","last_updated":"28 April 2026","preview":"--- During COVID the only active thing I would do was run. Every weekend I would schedule a long run. It usually used to be around 20 kilometres. I must have done quite many half-marathons over the year. As everything opened up, I joined a squash association. It was at a competit..."}],"sections":{"sections":[{"id":"latest","type":"notes","title":"Posts","items":null},{"id":"books","type":"books","title":"Books","items":[{"title":"Emissaries Around the Distant Sun","subtitle":"A Short Story Collection","cover":"/static/assets/imgs/books/emissaries-around-the-distant-sun.png","url":"https://a.co/d/9x9tTBE"}]}]},"current_note":{"title":"A.I That Writes Its Own A.I","slug":"ai-that-writes-its-own-ai","html":"<h1>A.I That Writes Its Own A.I</h1>\n<hr />\n<p>Yep, you read that right. AI that writes its own AI. AutoML (automated machine learning) is a neural network that designs other neural networks. Sundar Pichai showed AutoML at the 2017 Google I/O. According to Google, it scored a record 82 per cent prediction accuracy in correctly classifying images by their content. And, in the task of marking the location of multiple objects in an image, it scored 43 per cent compared to 39 per cent by the best human-built system.</p>\n<p>Now, why would A.I researchers want to build machines which would replace them? According to Pichai, there is a need for AI systems whereas the availability of AI researchers is scarce. And, Google wants to enable developers to harness the power of AI. In fact, as the demand for machine learning applications is growing, this will enable many novices to use machine learning for their applications.</p>\n<p>So, how does an automated machine learning work? To understand this, first we need to understand what is it that a machine learning expert deals with. Given a dataset, a machine learning expert has to select its features. To elucidate this, I will take a simple example of predicting house prices in an area. Consider that you have data about all the accommodations available near MIT and you want to predict the rent of an accommodation given certain inputs such as the number of rooms. The data may contain features such as the number of rooms, floor area, rent, floor on which it is located, etc. Now, features need to be extracted from this data to make the machine learning model. You may select floor size and number of rooms as the input parameters and predict the rent. You might think that the floor on which it is located does not matter in considering the rent amount. Thus, you have extracted features from the data. Next, the machine learning expert has to select the right model on which to train the data on. In this case, we can take the model as a simple polynomial function and vary (the machine learning algorithm will automatically select) the coefficients to fit the curve according to the data. Here, the training involves figuring out the right coefficient for each of the power of x in the polynomial expression. To train the model, the data is generally split into a training dataset and a test dataset. We train the model with the training dataset and check its accuracy with the test dataset. So, back to the prediction problem. Since we have two features as input and the prediction (rent) as output, the total dimensions will be three. We can then plot this data on a 3D space as a topology mesh. To make this easier to imagine, let’s reduce the input features to one. Thus we will get 2D graph; one axis representing input and the other axis representing output. Thus, the model we train will either be a line or a polynomial curve depending on the dataset and the model we choose to represent it with. So, on one axis you have the floor size and on the other, you have the rent. Now, if a prediction is to be made on the data (in this case the floor size) then, for the given floor size a corresponding rent value can be figured out by the coordinate of the point on the curve. Now, this is just a basic example and might not lead to an accurate prediction in the real world. But, hey! I did not claim to be an expert.</p>\n<p><img src=\"/static/assets/imgs/ai-writes-own-ai/curve-c0926fce-5a02-4453-95bb-16f9f9d70062.png\" alt=\"\" /></p>\n<p><img src=\"/static/assets/imgs/ai-writes-own-ai/graph-31cab06e-0aaf-40d8-ad8d-1de6f48beed6.jpg\" alt=\"\" /></p>\n<p>As you can see the machine learning expert has to select features from the dataset and as the number of features increases so does the complexity; as can be seen from the example with 2D and 3D plots.</p>\n<p>Next, a model is selected based on the data. For datasets like stock prices and house prices, linear regression or polynomial regression are sufficient. And, for image recognition, neural nets are employed. Also, these aren’t the only models available and each model further requires optimization for the given task. Finally, different training methods are used to train for the data sets, for example, reinforcement learning. (Note: Reinforcement Learning and Neural Nets were covered in the previous issues of MCUG Newsletter.)</p>\n<p>An AutoML algorithm does all this task on its own. It selects features, creates an optimized model and trains on dataset given. In case you are wondering how an automated machine learning algorithm is formally defined ⸺ here you go:</p>\n<p><img src=\"/static/assets/imgs/ai-writes-own-ai/Untitled-e558073a-68bc-453c-b2b5-beaed6e768eb.png\" alt=\"\" /></p>\n<p><img src=\"/static/assets/imgs/ai-writes-own-ai/graph-3e151dc5-b23d-4256-8f59-00cf135d8068.png\" alt=\"\" /></p>\n<p>So, how does the Google’s AutoML work? There is a controller neural net (the main neural net) which proposes a “child” model architecture (which is also a neural net), which is trained and evaluated for quality on a particular task. The feedback is then used to inform the controller how to improve its proposals for the next round. This process is repeated thousands of times. Eventually, the neural nets which perform the best on the given data set are created. In short, the controller creates various neural nets that are tested. The controller then selects the best neural nets from them and uses these to create other neural nets. This follows the reinforcement learning approach. And finally, a model is created which can be applied to the data and used by the developer for his/her application.</p>\n<h2>Conclusion</h2>\n<p>Automated machine learning has a lot of scope in the future. Given that it has created better AI in some cases than human experts, it is possible that its use will increase across all industries. There is also the exciting possibility that any layman will be able to harness the power of AI using this technology. Increasingly, many researchers outside Google are also working on it. The future of automated machine learning sure looks bright.</p>\n<h2>References</h2>\n<p><a href=\"http://papers.nips.cc/paper/5872-efficient-and-robust-automated-machine-learning.pdf\">http://papers.nips.cc/paper/5872-efficient-and-robust-automated-machine-learning.pdf</a><br />\n<a href=\"https://www.wired.com/story/googles-learning-software-learns-to-write-learning-software/\">https://www.wired.com/story/googles-learning-software-learns-to-write-learning-software/</a><br />\n<a href=\"https://www.youtube.com/watch?v=92-DoDjCdsY\">https://www.youtube.com/watch?v=92-DoDjCdsY</a><br />\n<a href=\"https://research.googleblog.com/2017/05/using-machine-learning-to-explore.html\">https://research.googleblog.com/2017/05/using-machine-learning-to-explore.html</a><br />\n<a href=\"https://research.googleblog.com/2017/11/automl-for-large-scale-image.html\">https://research.googleblog.com/2017/11/automl-for-large-scale-image.html</a><br />\n<a href=\"https://cdn-images-1.medium.com/max/800/1*ikLN7U7umV3O7SN_0IGxqw.jpeg\">https://cdn-images-1.medium.com/max/800/1*ikLN7U7umV3O7SN_0IGxqw.jpeg</a><br />\n<a href=\"https://are.berkeley.edu/~pberck/EnvEcon/bressler_surface.jpg\">https://are.berkeley.edu/~pberck/EnvEcon/bressler_surface.jpg</a></p>\n","extra_info":"This was originally written for MCUG Newsletter, April’18. That issue did not come out. It was then posted online on 8th August 2018","backlinks":[]},"graph":{"nodes":[{"slug":"a-cup-of-coffee-for-alan","title":"A Cup of Coffee for Alan","tags":["story","ai","programming"]},{"slug":"a-very-basic-introduction-to-artificial-neural-network","title":"A Very Basic Introduction to Artificial Neural Network","tags":["ai","programming"]},{"slug":"ai-that-writes-its-own-ai","title":"A.I That Writes Its Own A.I","tags":["story","ai","ml"]},{"slug":"aggressive","title":"Aggressive","tags":["ai"]},{"slug":"ai-environment-types","title":"AI Environment Types","tags":["story","ai"]},{"slug":"autoemailer","title":"AutoEmailer","tags":["ai","security","programming"]},{"slug":"basics","title":"Basics.","tags":["general"]},{"slug":"brain-machine-interfaces","title":"Brain Machine Interfaces","tags":["story","ai","programming"]},{"slug":"broken-links-and-readibility","title":"Broken Links and Readibility","tags":["story","ai","programming"]},{"slug":"creating-neural-network-from-scratch-in-python","title":"Creating Neural Network from Scratch in Python","tags":["ai","programming"]},{"slug":"decision-trees","title":"Decision Trees","tags":["ai","ml","programming"]},{"slug":"domains-of-warfare","title":"Domains of Warfare","tags":[
